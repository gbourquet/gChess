name: CI

# Vérification des pull requests. Le déploiement rejoue ces mêmes
# tests avant de publier l'image (voir deploy.yml).
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Les tests d'intégration utilisent Testcontainers et gèrent leur propre
    # base. Ce PostgreSQL sert à `generateOpenApiSpec`, dont integrationTest
    # dépend : la tâche démarre le module Ktor complet, donc Koin et HikariCP,
    # et exige une base joignable sur localhost:5432. Les valeurs reprennent
    # les défauts de application.conf.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gchess_dev
          POSTGRES_USER: gchess
          POSTGRES_PASSWORD: gchess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gchess -d gchess_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      # Les sources jOOQ sont committées dans src/main/generated/,
      # inutile de lancer une base pour les régénérer au build.
      - name: Tests unitaires
        run: ./gradlew unitTest -x generateJooq -x setupJooqDatabase

      - name: Tests d'architecture (ArchUnit)
        run: ./gradlew architectureTest -x generateJooq -x setupJooqDatabase

      # Testcontainers démarre un PostgreSQL 16 éphémère.
      - name: Tests d'intégration
        run: ./gradlew integrationTest -x generateJooq -x setupJooqDatabase

      - name: Publier les rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: build/reports/tests/
          retention-days: 7

  docker:
    name: Build de l'image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Le cache GHA exige le driver docker-container : le driver docker
      # par défaut ne sait pas exporter de cache.
      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      # On vérifie que le Dockerfile compile toujours, sans publier.
      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
