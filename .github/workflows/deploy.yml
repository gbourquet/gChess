name: Deploy

# Build de l'image sur les runners GitHub, publication sur GHCR,
# puis simple « pull & up » sur le serveur : rien n'est compilé
# en production.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # Deux déploiements simultanés se marcheraient dessus sur le serveur.
  group: deploy-back
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gchess-back

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Nécessaire à `generateOpenApiSpec`, dont integrationTest dépend : la
    # tâche démarre le module Ktor complet et exige une base joignable sur
    # localhost:5432. Les tests d'intégration, eux, passent par Testcontainers.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gchess_dev
          POSTGRES_USER: gchess
          POSTGRES_PASSWORD: gchess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gchess -d gchess_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires + architecture + intégration
        run: ./gradlew unitTest architectureTest integrationTest -x generateJooq -x setupJooqDatabase

      # Sans ça, un échec ne laisse que la ligne « FAILED » dans les logs,
      # sans le message d'assertion.
      - name: Publier les rapports de test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: build/reports/tests/
          retention-days: 7

  build:
    name: Build et publication de l'image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Le cache GHA exige le driver docker-container : le driver docker
      # par défaut ne sait pas exporter de cache.
      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authentification GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Le tag SHA rend le rollback trivial :
          #   sed -i "s|^BACK_IMAGE=.*|BACK_IMAGE=<image>:<sha précédent>|" .env
          #   docker compose up -d back
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement sur le serveur
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Si le secret SSH_KNOWN_HOSTS est fourni (sortie de `ssh-keyscan`
          # exécuté depuis une machine de confiance), la clé du serveur est
          # épinglée. Sinon on accepte celle présentée au premier contact.
          #
          # Un `ssh-keyscan` lancé ici à chaque déploiement n'apporterait
          # rien : il ferait confiance à ce que le réseau lui répond, très
          # exactement comme accept-new. Il ajoutait en revanche un point
          # d'échec — son délai par défaut de 5 s suffit à faire tomber tout
          # le déploiement sur une latence passagère.
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "Clé serveur épinglée via SSH_KNOWN_HOSTS"
          else
            echo "SSH_KNOWN_HOSTS non défini : confiance au premier contact"
          fi
          chmod 644 ~/.ssh/known_hosts 2>/dev/null || true

          cat > ~/.ssh/config <<EOF
          Host deploy-target
              HostName ${{ secrets.SSH_HOST }}
              User ${{ secrets.SSH_USER }}
              Port ${{ secrets.SSH_PORT || 22 }}
              IdentityFile ~/.ssh/id_deploy
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
              ConnectTimeout 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Vérifier l'accès au serveur
        run: ssh deploy-target "echo 'SSH OK' && docker version --format '{{.Server.Version}}'"

      # Le repo back est propriétaire de la stack : on synchronise le
      # compose et la conf nginx à chaque déploiement. .env est exclu,
      # il contient les secrets et vit uniquement sur le serveur.
      - name: Synchroniser la stack de déploiement
        run: |
          rsync -az --delete --exclude '.env' deploy/ deploy-target:/opt/gchess/

      - name: Pull et redémarrage
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh deploy-target "GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd /opt/gchess

          # Login éphémère : le token du job expire à la fin du workflow,
          # aucun identifiant durable n'est stocké sur le serveur.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u token --password-stdin

          # Épingle la version déployée (tag SHA) dans .env
          sed -i "s|^BACK_IMAGE=.*|BACK_IMAGE=${{ env.IMAGE }}:${{ github.sha }}|" .env

          docker compose pull back
          docker compose up -d back

          docker logout ghcr.io
          docker image prune -f
          ENDSSH

      - name: Vérifier la santé du service
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "⚠️  Variable DOMAIN non définie : contrôle de santé public ignoré."
            echo "    La définir dans Settings → Secrets and variables → Actions → Variables."
            exit 0
          fi

          # GET, pas HEAD : les routes Ktor sont déclarées en `get(...)` et
          # répondraient 405 à un `curl -I`.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/health" || true)
            if [ "$code" = "200" ]; then
              echo "✅ Back en ligne (/health → 200)"
              exit 0
            fi
            echo "Tentative $i : /health → $code"
            sleep 5
          done
          echo "❌ Le back n'a pas répondu 200 sur /health après 150 s" >&2
          exit 1
