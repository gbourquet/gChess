# ============================================================
# Stack de production gChess — serveur 72.62.236.230
# ============================================================
#
# Le serveur héberge déjà d'autres sites derrière un nginx système :
# c'est lui qui détient les ports 80 et 443 et qui termine le TLS.
# La stack n'expose donc qu'un port HTTP sur la boucle locale, et son
# nginx interne se charge du routage applicatif.
#
#   Internet :443
#      → nginx SYSTÈME (TLS, certbot --nginx)  ← deploy/nginx-host/
#         → 127.0.0.1:${HTTP_PORT}
#            → nginx CONTENEUR                 ← deploy/nginx/
#               ├─ /      → front (Angular)
#               ├─ /api/  → back  (Ktor)
#               └─ /ws/   → back  (WebSocket)
#
# Aucun port n'est joignable depuis l'extérieur : le bind sur
# 127.0.0.1 rend la stack inaccessible autrement que par le nginx
# système, indépendamment du pare-feu.
#
# Les images sont construites par GitHub Actions et récupérées
# depuis ghcr.io — rien n'est compilé sur le serveur.
#
# Usage : voir deploy/README.md
# ============================================================

name: gchess

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  back:
    image: ${BACK_IMAGE}
    restart: unless-stopped
    environment:
      ENVIRONMENT: prod
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET}
      JWT_VALIDITY_MS: ${JWT_VALIDITY_MS:-86400000}
      # Même origine que le front (nginx) — CORS n'est en principe
      # jamais sollicité, mais on reste explicite.
      CORS_ORIGINS: https://${DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  front:
    image: ${FRONT_IMAGE}
    restart: unless-stopped
    environment:
      # Consommé par le template nginx de l'image front
      PORT: 8080
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # Bind explicite sur la boucle locale : sans le préfixe 127.0.0.1,
      # Docker publierait sur 0.0.0.0 et ouvrirait le port au monde en
      # contournant firewalld, qui ne voit pas les règles DOCKER de iptables.
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      # Le suffixe :z réétiquette le fichier pour SELinux (container_file_t).
      # Sans lui, sur une distribution Enterprise Linux, nginx se voit refuser
      # la lecture de sa propre configuration et le conteneur boucle au
      # démarrage.
      - ./nginx/gchess.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - back
      - front
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
