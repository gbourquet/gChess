# ============================================================
# Stack de production gChess — serveur 72.62.236.230
# ============================================================
#
# Topologie : un seul nginx en frontal, tout le reste sur le
# réseau interne Docker (aucun port publié en dehors de 80/443).
#
#   https://gchess.sur-le-web.fr/         → front  (Angular)
#   https://gchess.sur-le-web.fr/api/...  → back   (Ktor)
#   https://gchess.sur-le-web.fr/ws/...   → back   (WebSocket)
#
# Les images sont construites par GitHub Actions et récupérées
# depuis ghcr.io — rien n'est compilé sur le serveur.
#
# Usage : voir deploy/README.md
# ============================================================

name: gchess

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  back:
    image: ${BACK_IMAGE}
    restart: unless-stopped
    environment:
      ENVIRONMENT: prod
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET}
      JWT_VALIDITY_MS: ${JWT_VALIDITY_MS:-86400000}
      # Même origine que le front (nginx) — CORS n'est en principe
      # jamais sollicité, mais on reste explicite.
      CORS_ORIGINS: https://${DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  front:
    image: ${FRONT_IMAGE}
    restart: unless-stopped
    environment:
      # Consommé par le template nginx de l'image front
      PORT: 8080
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Le suffixe :z réétiquette le fichier pour SELinux (container_file_t).
      # Sans lui, sur une distribution Enterprise Linux, nginx se voit refuser
      # la lecture de sa propre configuration et le conteneur boucle au
      # démarrage. Les volumes nommés, eux, sont étiquetés par Docker.
      - ./nginx/gchess.conf.template:/etc/nginx/templates/gchess.conf.template:ro,z
      - certbot-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    environment:
      DOMAIN: ${DOMAIN}
      # L'image nginx applique envsubst sur /etc/nginx/templates/*.template.
      # Sans cette liste, $host / $uri seraient eux aussi substitués.
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    depends_on:
      - back
      - front
    networks:
      - internal

  # Renouvellement automatique des certificats.
  # Certbot vérifie deux fois par jour ; Let's Encrypt ne renouvelle
  # qu'à moins de 30 jours de l'expiration, les autres passages sont
  # des no-op. Le rechargement de nginx est fait par le service reloader.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    networks:
      - internal

# nginx ne relit pas ses certificats tout seul : après un renouvellement il
# faut lui envoyer un SIGHUP. C'est fait par une tâche cron sur l'hôte
# (voir deploy/README.md) plutôt que par un conteneur montant
# /var/run/docker.sock — SELinux refuse cet accès sur Enterprise Linux, et
# donner la socket Docker à un conteneur revient à lui donner root.

volumes:
  pgdata:
  letsencrypt:
  certbot-webroot:

networks:
  internal:
