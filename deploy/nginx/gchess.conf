# ============================================================
# Routage applicatif gChess (nginx conteneurisé)
# ============================================================
# Ce nginx n'est joignable que depuis le nginx système, via
# 127.0.0.1. Il ne fait donc ni TLS ni redirection : le chiffrement
# est terminé en amont (voir deploy/nginx-host/gchess.conf).
#
# Il ne connaît qu'un seul site, d'où `server_name _`.
# ============================================================

server {
    listen 80 default_server;
    server_name _;

    # nginx résout les noms d'upstream une seule fois au démarrage et met
    # l'IP en cache. Or un déploiement recrée le conteneur back ou front,
    # qui repart avec une autre IP : nginx servirait des 502 jusqu'à son
    # propre redémarrage. En passant par le résolveur DNS interne de Docker
    # (127.0.0.11) et par une variable dans proxy_pass, la résolution est
    # refaite à chaud toutes les 10 s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $back  http://back:8080;
    set $front http://front:8080;

    # Les FEN et l'historique de coups compressent très bien.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    # Le nginx système transmet déjà X-Forwarded-For et X-Forwarded-Proto ;
    # on les relaie tels quels plutôt que de les réécrire.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # --- API REST ---
    location /api/ {
        proxy_pass $back$request_uri;
        proxy_http_version 1.1;
    }

    # --- WebSocket (matchmaking, partie, spectateur) ---
    location /ws/ {
        proxy_pass $back$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Une partie d'échecs peut rester silencieuse longtemps
        # (réflexion, adversaire absent) : sans ça nginx couperait
        # la WebSocket au bout de 60 s.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering     off;
    }

    # --- Sondes de santé ---
    location ~ ^/(health|actuator/health|ready|alive)$ {
        proxy_pass $back$request_uri;
        proxy_http_version 1.1;
        access_log off;
    }

    # --- Front Angular (SPA) ---
    location / {
        proxy_pass $front$request_uri;
        proxy_http_version 1.1;
    }
}
