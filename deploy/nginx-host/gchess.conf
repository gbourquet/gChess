# ============================================================
# Bloc à installer sur le nginx SYSTÈME du serveur
# ============================================================
#
#   cp deploy/nginx-host/gchess.conf /etc/nginx/conf.d/gchess.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d gchess.sur-le-web.fr
#
# Certbot ajoute lui-même `listen 443 ssl`, les directives de
# certificat et la redirection HTTP→HTTPS dans ce fichier. Ne pas les
# écrire à la main : certbot a besoin de reconnaître sa propre
# empreinte pour renouveler ensuite sans intervention.
#
# Ce fichier n'est PAS déployé automatiquement — il vit sur l'hôte,
# à côté des autres sites. Il est versionné ici pour référence, et
# n'a en principe jamais besoin d'évoluer : tout le routage
# applicatif (/, /api, /ws) est en aval, dans deploy/nginx/.
# ============================================================

server {
    listen 80;
    server_name gchess.sur-le-web.fr;

    # Une seule destination : le nginx de la stack gChess, publié sur
    # la boucle locale par docker compose (HTTP_PORT, 8080 par défaut).
    location / {
        proxy_pass http://127.0.0.1:8080;

        # Indispensable aux WebSockets : sans ces trois directives, le
        # handshake renvoie 400 ou 200 au lieu de 101, et le
        # matchmaking comme les parties ne se connectent jamais.
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le défaut de 60 s couperait les parties silencieuses
        # (joueur qui réfléchit, adversaire absent).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
